# ==============================================================================
# PSE Pulse — Personal Azure Edition
# Nginx Virtual Host Configuration Template
# ==============================================================================
# Serves statically exported Next.js pages directly from disk without Node.js.
# Proxies /api/ and /docs requests to the local FastAPI Uvicorn process.
#
# Production Host: Ubuntu 24.04 LTS (Standard_B2ats_v2 or Standard_B1s)
# Static root path: /var/www/pse-pulse/out
# FastAPI upstream: 127.0.0.1:8000 or unix:/run/pse-pulse/api.sock
# ==============================================================================

upstream pse_pulse_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Root directory for Next.js statically exported files
    root /var/www/pse-pulse/out;
    index index.html;

    # Gzip Compression for minimal bandwidth and snappy page loads
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static assets cache optimizations (_next/static, images, fonts)
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Static export HTML routing:
    # 1. Prefer $uri.html so /companies matches companies.html before the companies/ directory
    # 2. Try $uri for exact static files (_next/static, images, etc.)
    # 3. Try $uri/ which resolves / to index.html via server-level 'index index.html;'
    # 4. Fall through to =404 triggering error_page 404 /404.html (never returns 200 for missing pages)
    location / {
        try_files $uri.html $uri $uri/ =404;
        add_header Cache-Control "no-cache, public, must-revalidate";
    }

    # Custom 404 error page for Next.js static export
    error_page 404 /404.html;
    error_page 403 =404 /404.html;

    location = /404.html {
        internal;
    }

    # FastAPI API endpoints (/api/*)
    # NOTE: proxy_pass without a URI path preserves the full original request URI (/api/v1/...)
    location /api/ {
        proxy_pass http://pse_pulse_backend;
        proxy_http_version 1.1;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Timeouts for low memory resilience
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Buffer settings
        proxy_buffering on;
        proxy_buffers 8 16k;
        proxy_buffer_size 16k;
    }

    # Production health check probe (/health)
    location = /health {
        proxy_pass http://pse_pulse_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Interactive API Documentation & OpenAPI schema
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass http://pse_pulse_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Deny hidden files (e.g. .git, .env)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# ==============================================================================
# HOW TO ADD HTTPS VIA LET'S ENCRYPT / CERTBOT (FUTURE DEPLOYMENT)
# ==============================================================================
# 1. Point your domain (e.g., pse-pulse.yourdomain.com) to the Azure Public IPv4.
# 2. Update 'server_name pse-pulse.yourdomain.com;' in the server block above.
# 3. On the VM, install Certbot:
#      sudo apt-get install -y certbot python3-certbot-nginx
# 4. Obtain and install certificate:
#      sudo certbot --nginx -d pse-pulse.yourdomain.com
# 5. Certbot will automatically add TLS listen directives, certificate paths,
#    and HTTP->HTTPS 301 redirection.
# ==============================================================================
