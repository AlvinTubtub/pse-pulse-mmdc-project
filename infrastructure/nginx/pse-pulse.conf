# HTTPS-only production virtual host. No listener is bound to TCP 80.
upstream pse_pulse_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    ssl_certificate     /etc/pse-pulse/tls/current/fullchain.pem;
    ssl_certificate_key /etc/pse-pulse/tls/current/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PSEPulseTLS:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    root /var/www/pse-pulse/current;
    index index.html;
    server_tokens off;
    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location ^~ /_next/static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /health/live {
        proxy_pass http://pse_pulse_backend/health/live;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        access_log off;
    }

    location = /health/ready {
        proxy_pass http://pse_pulse_backend/health/ready;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~* ^/(docs|redoc|openapi\.json)(/|$) {
        return 404;
    }

    location ^~ /api/ {
        proxy_pass http://pse_pulse_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
    }

    location = /health {
        return 308 /health/live;
    }

    location / {
        try_files $uri.html $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
