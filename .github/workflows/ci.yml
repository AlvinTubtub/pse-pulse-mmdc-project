name: PSE Pulse CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-models.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-models.txt

      - name: Compile and test backend
        env:
          ENVIRONMENT: test
          DEMO_MODE: "true"
          DATABASE_URL: "sqlite:///:memory:"
        run: |
          python -m compileall backend/app backend/pipeline
          pytest -v

  lstm-selection-test:
    name: LSTM & Selection Tests (CPU)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-models.txt
            backend/requirements-lstm.txt

      - name: Install CPU LSTM test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-models.txt
          pip install -r backend/requirements-lstm.txt

      - name: Run selection and LSTM methodology tests
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: |
          pytest -v \
            backend/tests/test_real_selections.py \
            backend/tests/test_real_lstm_dependency_boundary.py \
            backend/tests/test_real_lstm.py \
            backend/tests/test_real_lstm_artifacts.py \
            backend/tests/test_phase3b2_bundle.py \
            backend/tests/test_real_authoritative_artifacts.py

  frontend-build:
    name: Frontend Lint, Typecheck & Static Export
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint check
        working-directory: frontend
        run: npm run lint

      - name: TypeScript typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build Next.js static export
        working-directory: frontend
        run: npm run build

      - name: Production dependency security audit
        working-directory: frontend
        run: npm audit --omit=dev
