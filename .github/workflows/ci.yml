name: PSE Pulse CI

on:
  push:
    branches: [ "main", "validation/phase4d1" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    # Disposable CI-only service credentials. This PostgreSQL service exists
    # only for this isolated job and is never pointed at Azure or production.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pse_test
          POSTGRES_PASSWORD: ci-only-phase4d1-password
          POSTGRES_DB: pse_phase4d1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pse_test -d pse_phase4d1_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PSE_TEST_DATABASE_URL: postgresql+psycopg://pse_test:ci-only-phase4d1-password@127.0.0.1:5432/pse_phase4d1_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-models.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-models.txt

      - name: Apply and verify Alembic migrations on disposable PostgreSQL 16
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql+psycopg://pse_test:ci-only-phase4d1-password@127.0.0.1:5432/pse_phase4d1_test
        run: |
          python -m alembic -c backend/alembic.ini upgrade head
          python - <<'PY'
          import os
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          from sqlalchemy import create_engine, text

          config = Config("backend/alembic.ini")
          heads = ScriptDirectory.from_config(config).get_heads()
          if len(heads) != 1:
              raise SystemExit(f"Expected one Alembic head, found {len(heads)}")
          engine = create_engine(os.environ["DATABASE_URL"])
          with engine.connect() as connection:
              current = connection.execute(text("SELECT version_num FROM alembic_version")).scalar_one()
          engine.dispose()
          if current != heads[0]:
              raise SystemExit(f"Database revision {current} does not equal code head {heads[0]}")
          print(f"Disposable PostgreSQL schema is at Alembic head {current}.")
          PY

      - name: Run Phase 4D.1 regression and PostgreSQL concurrency tests
        env:
          ENVIRONMENT: test
          DEMO_MODE: "true"
          DATABASE_URL: "sqlite:///:memory:"
        run: |
          pytest -v \
            backend/tests/test_production_runner.py \
            backend/tests/test_production_postgres.py \
            backend/tests/test_real_forecast_service.py \
            backend/tests/test_real_calendar.py

      - name: Compile and test backend
        env:
          ENVIRONMENT: test
          DEMO_MODE: "true"
          DATABASE_URL: "sqlite:///:memory:"
        run: |
          python -m compileall backend/app backend/pipeline
          pytest -v

  lstm-selection-test:
    name: LSTM & Selection Tests (CPU)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-models.txt
            backend/requirements-lstm.txt

      - name: Install CPU LSTM test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-models.txt
          pip install -r backend/requirements-lstm.txt

      - name: Run selection and LSTM methodology tests
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: |
          pytest -v \
            backend/tests/test_phase3b3_gate_runtime.py \
            backend/tests/test_real_selections.py \
            backend/tests/test_real_lstm_dependency_boundary.py \
            backend/tests/test_real_lstm.py \
            backend/tests/test_real_lstm_artifacts.py \
            backend/tests/test_phase3b2_bundle.py \
            backend/tests/test_real_authoritative_artifacts.py

  frontend-build:
    name: Frontend Lint, Typecheck & Static Export
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint check
        working-directory: frontend
        run: npm run lint

      - name: TypeScript typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build Next.js static export
        working-directory: frontend
        run: npm run build

      - name: Production dependency security audit
        working-directory: frontend
        run: npm audit --omit=dev
