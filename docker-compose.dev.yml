# ==============================================================================
# PSE Pulse — Personal Azure Edition
# Local Development PostgreSQL Service
# ==============================================================================
# NOTE: Docker is strictly intended for local development convenience.
# Production Azure VM runs PostgreSQL on Azure Database for PostgreSQL Flexible
# Server (B1ms) without Docker.
# ==============================================================================

version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pse_pulse_dev_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pse_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pse_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-pse_pulse_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pse_user} -d ${POSTGRES_DB:-pse_pulse_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
    name: pse_pulse_dev_postgres_data
